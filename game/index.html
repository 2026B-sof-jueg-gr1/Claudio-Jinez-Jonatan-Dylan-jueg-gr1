<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INKBREAKER: El Último Trazo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      background-color: #07080d;
      color: #f4f6fb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* Fondo moderno con luces ambientales neón */
    body::before, body::after {
      content: '';
      position: fixed;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      filter: blur(130px);
      z-index: -1;
      opacity: 0.35;
      pointer-events: none;
    }
    body::before {
      background: #00f5d4;
      top: -160px;
      left: -120px;
    }
    body::after {
      background: #ff006e;
      bottom: -160px;
      right: -120px;
    }

    /* Cabecera superior */
    .top-bar {
      width: 100%;
      max-width: 660px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(12px);
      border-radius: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #00f5d4, #ff006e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(0, 245, 212, 0.14);
      color: #00f5d4;
      border: 1px solid rgba(0, 245, 212, 0.3);
      letter-spacing: 1px;
    }

    .back-link {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      transition: all 0.2s ease;
    }
    .back-link:hover {
      background: rgba(255, 0, 110, 0.2);
      color: #ffffff;
    }

    /* Marco cristalino alrededor del juego */
    .stage-wrapper {
      padding: 12px;
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.65),
        0 0 40px rgba(0, 245, 212, 0.12);
      backdrop-filter: blur(16px);
    }

    #game-container {
      border-radius: 12px;
      overflow: hidden;
      line-height: 0;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    /* Barra inferior de controles estilo moderno */
    .controls-bar {
      width: 100%;
      max-width: 660px;
      margin-top: 14px;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      font-size: 0.82rem;
      color: #a8b3cf;
    }

    .ctrl-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    kbd {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 2px 7px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="brand">
      <h1>INKBREAKER</h1>
      <span class="badge">ARCADE RPG</span>
    </div>
    <a href="../index.html" class="back-link">← Escaparate</a>
  </header>

  <main class="stage-wrapper">
    <div id="game-container"></div>
  </main>

  <footer class="controls-bar">
    <div class="ctrl-item"><kbd>WASD</kbd> Moverse</div>
    <div class="ctrl-item"><kbd>ESPACIO</kbd> Pulso / Diálogo</div>
    <div class="ctrl-item"><kbd>SHIFT</kbd> Dash</div>
    <div class="ctrl-item"><kbd>Q</kbd> Escudo Sónico</div>
    <div class="ctrl-item"><kbd>M</kbd> Silenciar</div>
  </footer>

  <!-- Phaser 3 vía CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <!-- Punto de entrada del juego -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
