name: Deploy INKBREAKER to Itch.io

on:
  push:
    branches:
      - main

jobs:
  deploy-itchio:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Butler CLI
        run: |
          curl -fL --retry 5 --retry-delay 3 "https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default" -o butler.zip
          unzip -q butler.zip
          chmod +x butler
          sudo mv butler /usr/local/bin/butler
          butler -V

      - name: Publicar carpeta game/ en Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          butler push game/ JonaDC/inkbreaker:html5